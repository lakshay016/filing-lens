[project]
name = "filinglens"
version = "0.1.0"
description = "Change-aware research tool over SEC filings"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer",
    "pydantic-settings",
    "sqlalchemy>=2.1.8",
    "psycopg[binary]>=3.3.9",
    "alembic>=1.20.1",
    "pgvector>=0.5.1",
]

[project.scripts]
fl = "filinglens.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "hypothesis",
    "respx",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filinglens"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
exclude = ["node_modules", "migrations/versions"]

[tool.ruff.format]
# Ruff 0.17 also formats Markdown; the docs are not ours to reflow.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = false
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["filinglens.align.*", "filinglens.backtest.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["db: needs the local Postgres test database"]
addopts = "-ra --strict-markers"
