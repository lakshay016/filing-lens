name: filinglens

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: filinglens
      POSTGRES_PASSWORD: filinglens
      POSTGRES_DB: filinglens
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - filinglens_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filinglens -d filinglens"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  filinglens_pg:
